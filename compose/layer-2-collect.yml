networks:
  aiops_default:
    external: true

volumes:
  vector-output:
    name: aiops_vector-output

services:
  vector:
    image: timberio/vector:0.58.0-debian
    container_name: aiops-vector
    restart: unless-stopped
    networks:
      - aiops_default
    ports:
      - "8686:8686"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-output:/var/lib/vector/output
    command: ["--config", "/etc/vector/vector.yaml"]
