api:
  enabled: true
  address: "0.0.0.0:8686"

sources:
  keep_logs:
    type: docker_logs
    include_containers:
      - "aiops-keep"

  juice_shop_logs:
    type: docker_logs
    include_labels:
      - "io.kubernetes.pod.namespace=juice-shop"

transforms:
  enrich:
    type: remap
    inputs:
      - "keep_logs"
      - "juice_shop_logs"
    source: |
      .level = "unknown"
      msg = downcase(string!(.message))
      if contains(msg, "error") { .level = "error" }
      else if contains(msg, "warn") { .level = "warn" }
      else if contains(msg, "info") { .level = "info" }
      name = string!(.container_name)
      .app = "unknown"
      if contains(name, "juice-shop") { .app = "juice-shop" }
      else if contains(name, "keep") { .app = "keep" }

sinks:
  console_debug:
    type: console
    inputs:
      - "enrich"
    encoding:
      codec: json

  file_out:
    type: file
    inputs:
      - "enrich"
    path: "/var/lib/vector/output/events-%Y-%m-%d.log"
    encoding:
      codec: json

  kafka_logs_raw:
    type: kafka
    inputs:
      - "enrich"
    bootstrap_servers: "redpanda:9092"
    topic: "logs.raw"
    encoding:
      codec: json
